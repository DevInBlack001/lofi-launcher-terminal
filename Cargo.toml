[workspace]
resolver = "2"
members = ["crates/lofi-common", "crates/lofi-daemon", "crates/lofi-cli"]

# Kept in sync with version.json by scripts/sync-version.sh, which is the
# single source of truth for the project's version across Cargo.toml and
# PKGBUILD.
[workspace.package]
version = "0.1.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
