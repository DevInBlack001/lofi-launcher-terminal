default_mood = "code-and-chill"
long_source_minutes = 20

# When a source finishes playing on its own, move on to the next source in the
# current mood, wrapping back to the first after the last. Set to false to stop
# at the end of each source instead. `lofi loop on|off` changes this for the
# running daemon without editing this file.
loop_playback = true

# Stream quality for URL sources: "min" (smallest audio stream, saves
# bandwidth) or "max" (best audio stream). Either way only an audio-only
# stream is fetched when the source offers one; video is never streamed just
# to be thrown away. Local files are unaffected. `lofi quality min|max`
# changes this for the running daemon, starting with the next source.
audio_quality = "min"

# Each mood is a list of sources.
# A source is a local path or a URL mpv/yt-dlp can resolve.
# Synthwave, retrowave, and vaporwave are genre flavors: mix them into
# whichever mood's list fits best (e.g. vaporwave under chill-beats).
[moods.code-and-chill]
sources = []

[moods.deep-focus]
sources = []

[moods.chill-beats]
sources = []

[moods.rainy-day]
sources = []

[moods.ambient]
sources = []

# Keywords used by `lofi add` to classify a new source into a mood.
# Each mood is scored by counting case-insensitive keyword occurrences in the
# source's title (weighted 3x) and description (1x); the highest score wins,
# with ties going to the alphabetically first mood. Matching is by plain
# substring, so a short keyword also hits inside longer words (e.g. "rain"
# in "training", "space" in "workspace").
[classifier]
code-and-chill = ["code", "study", "synthwave", "retrowave", "productivity"]
deep-focus = ["deep focus", "concentration", "flow state"]
chill-beats = ["chill", "beats", "hip hop", "lofi hip hop", "vaporwave"]
rainy-day = ["rain", "storm", "thunder", "cozy"]
ambient = ["ambient", "drone", "atmosphere", "space"]
